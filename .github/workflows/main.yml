name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.6.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the saved signing key"
          else
            echo "No saved key, this build gets a new one"
          fi
      - name: Build
        run: cd launcher && chmod +x gradlew && ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
